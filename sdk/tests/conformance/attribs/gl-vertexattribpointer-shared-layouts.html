<html>
<head>
<meta charset="utf-8">
<title>Rendering with planar and overlapping vertex attribute arrays</title>
<link rel="stylesheet" href="../../resources/js-test-style.css">
<script src="../../js/js-test-pre.js"></script>
<script src="../../js/webgl-test-utils.js"></script>
<script id="vshader" type="x-shader/x-vertex">
attribute vec2 position;
attribute vec3 color;
varying vec3 vColor;
void main() {
    gl_Position = vec4(position, 0.0, 1.0);
    vColor = color;
}
</script>
<script id="fshader" type="x-shader/x-fragment">
precision mediump float;
varying vec3 vColor;
void main() {
    gl_FragColor = vec4(vColor, 1.0);
}
</script>
</head>
<body>
<canvas id="canvas" width="8" height="8"></canvas>
<div id="description"></div>
<div id="console"></div>
<script>
"use strict";
description("Vertex attribute arrays may occupy separate planes in one buffer, or use a stride smaller than an attribute's size.");
var wtu = WebGLTestUtils;
var gl = wtu.create3DContext("canvas", {antialias: false});

function runTests() {
    if (!gl) {
        testFailed("Could not create WebGL context");
        return;
    }
    var program = wtu.setupProgram(gl, ["vshader", "fshader"], ["position", "color"]);
    if (!program) {
        testFailed("Could not create program");
        return;
    }
    gl.useProgram(program);
    var buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.enableVertexAttribArray(0);
    var indices = gl.createBuffer();
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indices);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array([0, 1, 2]), gl.STATIC_DRAW);
    gl.clearColor(0, 0, 1, 1);

    for (var indexed = 0; indexed < 2; ++indexed) {
        var drawName = indexed ? "drawElements" : "drawArrays";
        // Each plane contains three records with a 12-byte stride. The second
        // attribute starts at byte 36 of the same allocation, not within the
        // first attribute's record. Both arrays remain fully in bounds.
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
            -1, -1, 0, 3, -1, 0, -1, 3, 0,
             1,  0, 0, 1,  0, 0,  1, 0, 0
        ]), gl.STATIC_DRAW);
        gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 12, 0);
        gl.enableVertexAttribArray(1);
        gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 12, 36);
        wtu.glErrorShouldBe(gl, gl.NO_ERROR, "Setting planar arrays should succeed");
        drawAndCheck(indexed, [255, 0, 0, 255], drawName + " with separate attribute planes");

        // Consecutive vec2 records share one float: (-1,-1), (-1,3), (3,-1).
        // The stride is 4 bytes and the attribute size is 8 bytes. The last
        // record still ends within this 16-byte allocation.
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1]), gl.STATIC_DRAW);
        gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 4, 0);
        gl.disableVertexAttribArray(1);
        gl.vertexAttrib3f(1, 0, 1, 0);
        wtu.glErrorShouldBe(gl, gl.NO_ERROR, "Setting overlapping records should succeed");
        drawAndCheck(indexed, [0, 255, 0, 255], drawName + " with overlapping records");
    }
    gl.deleteBuffer(indices);
    gl.deleteBuffer(buffer);
    gl.deleteProgram(program);
}

function drawAndCheck(indexed, expected, label) {
    gl.clear(gl.COLOR_BUFFER_BIT);
    if (indexed) {
        gl.drawElements(gl.TRIANGLES, 3, gl.UNSIGNED_SHORT, 0);
    } else {
        gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    wtu.glErrorShouldBe(gl, gl.NO_ERROR, label + " should not generate errors");
    wtu.checkCanvas(gl, expected, label + " should cover the canvas", 0);
}

runTests();
var successfullyParsed = true;
</script>
<script src="../../js/js-test-post.js"></script>
</body>
</html>
