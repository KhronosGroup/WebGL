<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../resources/js-test-style.css"/>
<script src="../../js/js-test-pre.js"></script>
<script src="../../js/webgl-test-utils.js"></script>
</head>
<body>
<div id="description"></div>
<div id="console"></div>

<script>
"use strict";
description("This test verifies getUniformIndices behaviors.");

debug("");

var wtu = WebGLTestUtils;

const gl = wtu.create3DContext(undefined, undefined, 2);

const VSRC = `\
  #version 300 es
  precision mediump float;
  uniform float u_vert_scalar;
  uniform float u_vert_arr[3];
  uniform float u_both_scalar;
  uniform float u_both_arr[3];
  void main() {
    gl_Position = vec4(0, 0, 0, 1);
    gl_Position.r += u_vert_scalar;
    gl_Position.r += u_vert_arr[1];
    gl_Position.r += u_both_scalar;
    gl_Position.r += u_both_arr[1];
  }
`;

const FSRC = `\
  #version 300 es
  precision mediump float;
  uniform float u_frag_scalar;
  uniform float u_frag_arr[3];
  uniform float u_both_scalar;
  uniform float u_both_arr[3];
  out vec4 o_frag_color;
  void main() {
    o_frag_color = vec4(0, 0, 0, 1);
    o_frag_color.r += u_frag_scalar;
    o_frag_color.r += u_frag_arr[1];
    o_frag_color.r += u_both_scalar;
    o_frag_color.r += u_both_arr[1];
  }
`;

(() => {
  if (!gl) {
    testFailed("WebGL context does not exist");
    return;
  }

  window.prog = wtu.setupProgram(gl, [VSRC, FSRC]);
  if (!prog) {
    testFailed("Setting up program failed");
    return;
  }
  let err = gl.getError();
  if (err) throw err;

  const IS_ACTIVE_BY_NAME = {
    'u_vert_scalar'   : true,
    'u_vert_scalar[0]': false,
    'u_vert_arr'      : true,
    'u_vert_arr[0]'   : true, // Even if the [0] is unused, the name enumerated
                              // via getActiveUniforms for this array is 'u_vert_arr[0]'.
    'u_vert_arr[1]'   : false,

    'u_frag_scalar'   : true,
    'u_frag_scalar[0]': false,
    'u_frag_arr'      : true,
    'u_frag_arr[0]'   : true,
    'u_frag_arr[1]'   : false,

    'u_both_scalar'   : true,
    'u_both_scalar[0]': false,
    'u_both_arr'      : true,
    'u_both_arr[0]'   : true,
    'u_both_arr[1]'   : false,
  };
  const NAMES = Object.keys(IS_ACTIVE_BY_NAME);
  const active_ids = gl.getUniformIndices(prog, NAMES);

  err = gl.getError();
  if (err) throw err;

  NAMES.forEach((name, i) => {
    const active_id_was = active_ids[i];
    const is_active_expected = IS_ACTIVE_BY_NAME[name];
    const is_active_was = active_id_was != gl.INVALID_INDEX;
    expectTrue(is_active_was == is_active_expected,
               `getUniformIndices([, '${name}' ,]) -> [, ${active_id_was} ,], should be [, ${is_active_expected ? '0<=N<INVALID_INDEX' : 'INVALID_INDEX'} ,]`);
    if (is_active_was) {
      const info = gl.getActiveUniform(prog, active_id_was);
      expectTrue(info.name.startsWith(name), `'${info.name}'.startsWith('${name}')`);
    }
  });

  debug("A valid program returns an empty array for empty uniform names");
  shouldBe("gl.getUniformIndices(prog, [])", "[]");
  wtu.glErrorShouldBe(gl, gl.NO_ERROR);

  debug("A valid program returns INVALID_INDEX for an unknown uniform name");
  shouldBe('gl.getUniformIndices(prog, ["missing"])', "[gl.INVALID_INDEX]");
  wtu.glErrorShouldBe(gl, gl.NO_ERROR);

  debug("A program from another context returns null");
  const other = wtu.create3DContext(undefined, undefined, 2);
  if (!other) {
    testFailed("Second WebGL context does not exist");
    return;
  }
  const other_prog = wtu.setupProgram(other, [VSRC, FSRC]);
  if (!other_prog) {
    testFailed("Setting up program in another context failed");
    return;
  }
  for (const names of [[], ["missing"]]) {
    expectTrue(gl.getUniformIndices(other_prog, names) === null,
               `A program from another context should return null with ${names.length} names`);
    wtu.glErrorShouldBe(gl, gl.INVALID_OPERATION);
  }

  debug("A deleted program returns null");
  // setupProgram makes the program current; unbind it so deletion is not deferred.
  other.useProgram(null);
  other.deleteProgram(other_prog);
  expectTrue(other.getUniformIndices(other_prog, ["missing"]) === null,
             "getUniformIndices should return null for a deleted program");
  wtu.glErrorShouldBe(other, other.INVALID_VALUE);

  debug("A lost context returns null");
  const extension = gl.getExtension("WEBGL_lose_context");
  if (!extension) {
    debug("WEBGL_lose_context is not supported; skipping the lost context test");
    return;
  }
  extension.loseContext();
  expectTrue(gl.isContextLost(), "WebGL context should be lost");
  expectTrue(gl.getUniformIndices(prog, ["missing"]) === null,
             "getUniformIndices should return null for a lost context");
})();

var successfullyParsed = true;
</script>
<script src="../../js/js-test-post.js"></script>

</body>
</html>
